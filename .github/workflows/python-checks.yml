name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile both editions
        run: python -m compileall -q fan_curve_editor.py fan_daemon.py trixie/pi5_fan_curve_trixie.py
      - name: Run controller unit tests
        run: python -m unittest discover -s tests -v
